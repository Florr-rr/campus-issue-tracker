spring.application.name=issuetracker

# Read passwords from the .env file in the project root (never committed to Git)
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway creates the tables; Hibernate only checks them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# MongoDB connection (authSource=admin because Docker created the user there)
spring.mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@localhost:27017/campus_issues?authSource=admin

# RabbitMQ connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
